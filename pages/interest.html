<section class="container mx-auto p-1 md:p-6">
  <div id="interest" class="space-y-6">
    <div class="text-center mb-8">
      <h2
        class="text-2xl md:text-3xl font-bold text-gray-900 dark:text-white mb-4"
      >
        Interest
      </h2>
      <p class="text-gray-600 dark:text-gray-300 max-w-2xl mx-auto">
        I'm passionate about exploring and learning from the world around me,
        always curious to dive into new ideas and inspiring discoveries! Here's
        a list of articles, books, videos, and papers that spark my interest.
      </p>
    </div>

    <div class="interest-nav flex justify-center mb-6">
      <div
        class="border-b border-gray-200 dark:border-gray-700 w-full max-w-2xl"
      >
        <nav class="flex justify-center space-x-8" aria-label="Tabs">
          <button
            data-tab="interest-book"
            class="tab-button py-4 px-6 border-b-2 font-medium text-sm whitespace-nowrap focus:outline-none border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 hover:border-gray-300"
          >
            Book list
          </button>
          <button
            data-tab="interest-paper"
            class="tab-button py-4 px-6 border-b-2 font-medium text-sm whitespace-nowrap focus:outline-none border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 hover:border-gray-300"
          >
            Paper list
          </button>
          <button
            data-tab="interest-video"
            class="tab-button py-4 px-6 border-b-2 font-medium text-sm whitespace-nowrap focus:outline-none border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 hover:border-gray-300"
          >
            Video list
          </button>
        </nav>
      </div>
    </div>

    <div class="interest-wrapper max-w-4xl mx-auto">
      <div id="interest-book" class="hidden">
        <ul class="space-y-6" id="book-list"></ul>
      </div>
      <div id="interest-paper" class="hidden">
        <ul class="space-y-6" id="paper-list"></ul>
      </div>
      <div id="interest-video" class="hidden">
        <ul class="space-y-6" id="video-list"></ul>
      </div>
    </div>
  </div>
</section>

  function toggleDisplay(sectionId) {
    document.querySelectorAll(".interest-wrapper > div").forEach((div) => {
      div.classList.add("hidden");
    });
    document.getElementById(sectionId).classList.remove("hidden");
    setActiveTab(sectionId);
  }

  function setActiveTab(tabId) {
    const tabs = document.querySelectorAll(".tab-button");
    const activeClasses = "border-blue-500 text-blue-600 dark:text-blue-400";
    const inactiveClasses =
      "border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 hover:border-gray-300";

    tabs.forEach((tab) => {
      if (tab.dataset.tab === tabId) {
        tab.classList.remove(...inactiveClasses.split(" "));
        tab.classList.add(...activeClasses.split(" "));
      } else {
        tab.classList.remove(...activeClasses.split(" "));
        tab.classList.add(...inactiveClasses.split(" "));
      }
    });
  }

  function createListItem(item) {
    const li = document.createElement("li");
    li.className =
      "p-4 rounded-lg border border-gray-700 dark:border-gray-200 hover:shadow-md transition-shadow";

    const link = document.createElement("a");
    link.href = item.url;
    link.target = "_blank";
    link.className =
      "text-blue-600 dark:text-blue-400 hover:underline font-medium block mb-2";
    link.textContent = item.title;

    const author = document.createElement("p");
    author.className = "text-sm text-gray-600 dark:text-gray-400 mb-2";
    author.textContent = `Author: ${item.author}`;

    const description = document.createElement("p");
    description.className = "text-sm text-gray-600 dark:text-gray-300";
    description.textContent = item.description;

    li.append(link, author, description);
    return li;
  }

  function renderContent() {
    const bookList = document.getElementById("book-list");
    const paperList = document.getElementById("paper-list");
    const videoList = document.getElementById("video-list");

    // Clear existing content
    [bookList, paperList, videoList].forEach((list) => {
      if (list) list.innerHTML = "";
    });

    // Render new content
    if (bookList) {
      const bookFragment = document.createDocumentFragment();
      interestData.books.forEach((book) =>
        bookFragment.appendChild(createListItem(book))
      );
      bookList.appendChild(bookFragment);
    }

    if (paperList) {
      const paperFragment = document.createDocumentFragment();
      interestData.papers.forEach((paper) =>
        paperFragment.appendChild(createListItem(paper))
      );
      paperList.appendChild(paperFragment);
    }

    if (videoList) {
      const videoFragment = document.createDocumentFragment();
      interestData.videos.forEach((video) =>
        videoFragment.appendChild(createListItem(video))
      );
      videoList.appendChild(videoFragment);
    }
  }

  // Initialize content and tabs
  function init() {
    // Add click listeners to tabs
    document.querySelectorAll(".tab-button").forEach((button) => {
      button.addEventListener("click", () => toggleDisplay(button.dataset.tab));
    });

    // Initial render
    renderContent();
    toggleDisplay("interest-book");
  }

  // Ensure DOM is loaded before initialization
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
</script>
